version: "3.9"

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: cipherrelay-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    tty: true
    stdin_open: true
    environment:
      APP_ENV: local
      PHP_MEMORY_LIMIT: 512M
    depends_on:
      - mysql
      - redis
    networks:
      - cipherrelay
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: cipherrelay-web
    ports:
      - "8020:80"
    tty: true
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - cipherrelay
    restart: unless-stopped

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: cipherrelay-queue
    working_dir: /var/www/html
    tty: true
    command: sh -lc "php artisan queue:work --verbose --tries=3 --timeout=90"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - cipherrelay
    restart: unless-stopped

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: cipherrelay-scheduler
    working_dir: /var/www/html
    command: sh -lc "php artisan schedule:work"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - cipherrelay
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: cipherrelay-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "33060:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cipherrelay
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cipherrelay-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "1279:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cipherrelay
    restart: unless-stopped

volumes:
  db_data:
  redis_data:

networks:
  cipherrelay:
    driver: bridge
